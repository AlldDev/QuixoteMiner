[package]
name = "quixote_native"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "quixote_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"
sha2 = { version = "0.10", features = ["compress"] }

# Build do .so usado pelo daemon: LTO e um codegen unit deixam o laço quente
# inteiro visível pro otimizador. Sem target-cpu=native, pra o binário seguir
# portável entre as máquinas (o SHA-NI já é detectado em runtime pelo sha2).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
